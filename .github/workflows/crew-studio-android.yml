name: Crew Studio Android app
on:
  push:
    branches: [main]
    paths: ['crew-studio-android/**', '.github/workflows/crew-studio-android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crew-studio-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk ../CrewStudio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CrewStudio-apk
          path: CrewStudio.apk
      - name: Publish it as a release (download it from the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: crew-studio-build-${{ github.run_number }}
          name: Crew Studio build ${{ github.run_number }}
          files: CrewStudio.apk
          make_latest: true
