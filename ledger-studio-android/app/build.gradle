plugins { id 'com.android.application' }

android {
    namespace 'com.ledgerstudio.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ledgerstudio.app'
        minSdk 29
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '0.1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        ledger {
            storeFile file(project.property('ledgerStoreFile'))
            storePassword project.property('ledgerStorePassword')
            keyAlias project.property('ledgerKeyAlias')
            keyPassword project.property('ledgerKeyPassword')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.ledger
        }
        debug { signingConfig signingConfigs.ledger }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'html' }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
