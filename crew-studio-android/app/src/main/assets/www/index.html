<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eeebe6"><title>Crew Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: white-and-gold marble desk; centered tab menu; the chosen tab unfolds one gilt workspace below it; frosted rails float on both sides (drawing tools left, secondary right); panels and flyouts appear only when called. */
:root{
  --marble:#eeebe6; --paper:#fbf9f6; --paper-2:#f3efe9; --paper-3:#e7e1d8; --rule:#d9d0c4;
  --ink:#231a2b; --muted:#6b6272;
  --plum:#3b1d52; --plum-2:#5a3480; --plum-ink:#2a1239; --plum-soft:#efe7f4; --plum-line:#d2c0e0;
  --gold:#b48a2e; --gold-hi:#ecd38a; --gold-ink:#7a5a14; --gold-soft:#f7eed6;
  --gold-grad:linear-gradient(135deg,#f5e3a4 0%,#b4862a 24%,#f7e8b2 46%,#a0741f 72%,#e8cb78 100%);
  --frost:rgba(252,250,247,.58); --frost-strong:rgba(252,250,247,.86);
  --good:#2b7a4b; --good-soft:#e1f0e6; --warn:#9a5f0e; --warn-soft:#f8ecd8; --crit:#b3261e; --crit-soft:#f8e1df;
  --shadow:0 1px 2px rgba(40,20,50,.10),0 8px 24px rgba(40,20,50,.12);
  --shadow-float:0 10px 34px rgba(25,10,35,.28),0 2px 6px rgba(25,10,35,.16);
  --font-ui:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --font-data:"Roboto Condensed",sans-serif-condensed,"Arial Narrow","Segoe UI",Roboto,sans-serif;
  --font-mark:"Marcellus SC","Cormorant SC",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background-color:var(--marble);color:var(--ink);font:14px/1.4 var(--font-ui);background-size:1200px 800px;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--plum-2);outline-offset:2px}
.gilt::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:var(--gold-grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:3}
.frost{background:var(--frost);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:var(--shadow-float)}
.frost.strong{background:var(--frost-strong)}

#mapbg{position:fixed;inset:0;z-index:0;pointer-events:none;background-repeat:no-repeat;background-position:0 0}
#app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:32px;height:32px;flex:0 0 auto}
.wm{font:400 19px/1 var(--font-mark);letter-spacing:.05em;color:var(--plum-ink);white-space:nowrap}
.tabs{position:relative;display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(252,250,247,.82);box-shadow:var(--shadow);overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:6;padding:8px 20px;border-radius:999px;font-weight:600;font-size:14px;color:var(--plum-ink);white-space:nowrap;transition:background .15s,color .15s,transform .25s cubic-bezier(.2,.8,.2,1)}
.tab:hover{background:rgba(59,29,82,.08)}
.tab[aria-selected="true"]{background:transparent;color:#f5e6b8;transform:translateY(-2px)}
.tab[aria-selected="true"]:hover{background:transparent}
.tab .s{display:none}
#tabJoin{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible}
#tabJoin g{transform-origin:var(--tjx,50%) var(--tjy,60px)}
#tabJoin g.rise{animation:tjRise .34s cubic-bezier(.2,.85,.25,1)}
@keyframes tjRise{from{transform:scaleY(.5);opacity:.35}to{transform:none;opacity:1}}
.tright{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0}
.jobpill{font:13px var(--font-data);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.jobpill b{color:var(--plum-ink);font-weight:600}
.hbtn{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--plum);background:rgba(252,250,247,.72);box-shadow:var(--shadow);flex:0 0 auto}
.hbtn svg{width:19px;height:19px}

.ws{position:relative;min-height:0;border-radius:18px;overflow:hidden;background:var(--paper);box-shadow:0 2px 4px rgba(40,20,50,.10),0 16px 40px rgba(40,20,50,.18);--rl:68px;--rr:68px}
.ws.gilt::before{z-index:40;padding:2px}
.view{position:absolute;inset:0}
.view canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.view.pan canvas{cursor:grab}
.view.deploying{animation:deploy .44s cubic-bezier(.22,.9,.24,1)}
@keyframes deploy{from{clip-path:inset(0 0 100% 0);opacity:.35}to{clip-path:inset(0 0 0 0);opacity:1}}

.rail{--ry:-50%;position:absolute;top:50%;transform:translateY(var(--ry));z-index:10;width:68px;max-height:calc(100% - 28px);border-radius:18px;display:flex;flex-direction:column}
#railL{left:12px}#railR{right:12px}
.rail.wide{width:100px}
.rail.rin{animation:railIn .38s .1s both cubic-bezier(.2,.8,.2,1)}
#railR.rin{animation-name:railInR}
@keyframes railIn{from{opacity:0;transform:translate(-22px,var(--ry))}to{opacity:1;transform:translate(0,var(--ry))}}
@keyframes railInR{from{opacity:0;transform:translate(22px,var(--ry))}to{opacity:1;transform:translate(0,var(--ry))}}
/* tall portrait screens (tablets held upright): rails sit low, within thumb reach */
@media (orientation:portrait) and (min-width:600px) and (min-height:860px){.rail{--ry:0px;top:auto;bottom:14px;max-height:calc(100% - 90px)}}
.rsc{display:flex;flex-direction:column;gap:1px;padding:7px 5px;overflow-y:auto;min-height:0;scrollbar-width:none;border-radius:inherit}
.rsc::-webkit-scrollbar{display:none}
.ri{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:42px;padding:4px 2px 3px;border-radius:11px;color:var(--plum);text-decoration:none;transition:background .12s;flex:0 0 auto}
.ri svg{width:21px;height:21px;flex:0 0 auto}
.ri span{font:600 9px/1.1 var(--font-data);letter-spacing:.05em;text-transform:uppercase;color:var(--plum-ink);opacity:.85;text-align:center}
.ri:hover:not(:disabled){background:rgba(59,29,82,.09)}
.ri.on{background:linear-gradient(180deg,#4b2868,#331747);color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(236,211,138,.6)}
.ri.on span{color:#f4e6bd;opacity:1}
.ri:disabled{opacity:.32;cursor:default}
.ri .bdg{position:absolute;top:2px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--plum);color:#f5e6b8;font:600 10px/16px var(--font-data);font-style:normal}
.ri .bdg.warn{background:#c9811a;color:#fff}.ri .bdg.good{background:var(--good);color:#fff}
.ri.store{min-height:62px;background:linear-gradient(180deg,#4b2868,#2f1442);color:var(--gold-hi);box-shadow:inset 0 0 0 1.5px rgba(236,211,138,.75),0 4px 12px rgba(59,29,82,.35);margin:3px 0}
.ri.store span{color:#f4e6bd;font-size:10.5px}
.ri.store svg{width:26px;height:26px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:0 0 auto}
.mi{height:36px;border-radius:10px;display:grid;place-items:center;color:var(--plum)}
.mi svg{width:19px;height:19px}
.mi:hover:not(:disabled){background:rgba(59,29,82,.09)}
.mi:disabled{opacity:.32;cursor:default}
.mi.on{background:var(--plum);color:var(--gold-hi)}
.mk{height:34px;border-radius:9px;font:600 12px var(--font-data);color:var(--plum);letter-spacing:.04em;flex:0 0 auto}
.mk:hover:not(:disabled){background:rgba(59,29,82,.09)}
.mk.on{background:linear-gradient(180deg,#4b2868,#331747);color:#f5e6b8}
.mk:disabled{opacity:.32;cursor:default}
.rs{flex:0 0 1px;height:1px;margin:4px 6px;background:linear-gradient(90deg,transparent,rgba(180,138,46,.75),transparent)}
.rtype{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;border-radius:12px;width:100%;flex:0 0 auto}
.rtype:hover{background:rgba(59,29,82,.09)}
.rtype canvas{width:46px;height:26px;border-radius:7px;box-shadow:0 0 0 1px rgba(180,138,46,.7)}
.rtype span{font:600 9px/1.1 var(--font-data);letter-spacing:.04em;text-transform:uppercase;color:var(--plum-ink);text-align:center;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile{display:flex;flex-direction:column;align-items:center;padding:5px 2px 4px;border-radius:11px;background:rgba(255,255,255,.5);width:100%;min-height:42px;justify-content:center;flex:0 0 auto}
.tile .k{font:600 8.5px/1.1 var(--font-data);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tile b{font:600 15px/1.2 var(--font-data);color:var(--plum-ink);font-variant-numeric:tabular-nums}
.tile.fix b{font-size:17px}
.tile.fix.good{background:#d9eedf}.tile.fix.good b{color:var(--good)}
.tile.fix.warn{background:#f6e6c8}.tile.fix.warn b{color:var(--warn)}
.tile.fix.crit{background:#f6d9d6}.tile.fix.crit b{color:var(--crit)}
button.tile:hover{background:rgba(255,255,255,.8)}
button.tile.on{background:var(--plum)}button.tile.on b,button.tile.on .k{color:#f5e6b8}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:3px;flex:0 0 auto}
.ptcard{display:flex;flex-direction:column;align-items:center;padding:7px 3px 6px;border-radius:12px;background:rgba(255,255,255,.55);width:100%;flex:0 0 auto}
.ptcard .k{font:600 8.5px var(--font-data);letter-spacing:.09em;color:var(--muted);text-transform:uppercase}
.ptcard b{font:600 24px/1.1 var(--font-data);color:var(--plum-ink);font-variant-numeric:tabular-nums}
.ptcard small{font:11px/1.2 var(--font-data);color:var(--muted);max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptcard.code b{font-size:17px;color:var(--plum)}
.ptcard:hover{background:rgba(255,255,255,.85)}
.ptcard+.ptcard{margin-top:3px}

.fly,.panel{position:absolute;z-index:20;border-radius:16px;display:flex;flex-direction:column;max-height:calc(100% - 24px)}
.fly{width:min(320px,calc(100% - 40px))}
.fsc,.psc{overflow:auto;min-height:0;padding:12px 14px 14px;border-radius:inherit;display:flex;flex-direction:column;gap:10px}
.fly h4,.panel h4{margin:2px 0 0;font:600 10.5px var(--font-data);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fhead b{font-weight:600;color:var(--plum-ink)}
.panel{top:12px;right:calc(var(--rr) + 24px);width:min(320px,calc(100% - var(--rr) - 40px));max-height:calc(100% - 80px);z-index:11;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.tchoice{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 3px 4px;border-radius:9px;background:rgba(255,255,255,.6);text-align:center;font:600 11px/1.15 var(--font-data);color:var(--ink);min-height:44px}
.tchoice:hover{background:#fff}
.tchoice.on{box-shadow:inset 0 0 0 1.5px var(--plum);background:#fff}
.tchoice canvas{width:34px;height:16px;border-radius:4px;flex:0 0 auto}
.fly.types{width:min(300px,calc(100% - 40px))}
.fly h4 small{font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);margin-left:4px}
.codes{display:flex;flex-wrap:wrap;gap:4px}
.code{padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.65);font:600 12.5px var(--font-data);color:var(--plum-ink);letter-spacing:.02em}
.code:hover{background:#fff}.code.on{background:var(--plum);color:#f5e6b8}
.swatches{display:flex;gap:8px}
.swatches button{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.15)}
.swatches button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--plum)}
.phsec{display:flex;flex-direction:column;gap:6px}
.phsec .ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.phsec .ph b{font-size:13.5px;color:var(--plum-ink)}
.slots,.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.slot,.thumb,.addph{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.6);display:grid;place-items:center;color:var(--plum);max-width:100%}
.slot img,.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.slot span{position:absolute;left:0;right:0;bottom:0;font:600 8.5px/1.6 var(--font-data);letter-spacing:.05em;text-transform:uppercase;text-align:center;background:rgba(42,18,57,.66);color:#f5e6b8}
.slot svg,.addph svg{width:20px;height:20px}
.slot:not(.has),.addph{box-shadow:inset 0 0 0 1.5px rgba(59,29,82,.25)}
.slot:hover,.addph:hover{background:#fff}

.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:9;max-width:calc(100% - var(--rl) - var(--rr) - 60px);padding:7px 16px;border-radius:999px;font:12.5px/1.3 var(--font-data);color:var(--plum-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rule);margin-right:5px;vertical-align:0}
.dot.good{background:var(--good)}.dot.warn{background:#d39020}.dot.crit{background:var(--crit)}

.lenpop,.minipop{position:absolute;z-index:22;width:144px;border-radius:11px;display:flex;flex-direction:column;gap:4px;padding:5px 6px 6px}
.lenpop.two{width:178px}
.minipop{width:auto;min-width:138px;max-width:min(214px,calc(100% - 24px));z-index:23}
.minipop.narrow{width:178px}
.lh{display:flex;align-items:center;gap:5px;font:11px var(--font-data);color:var(--muted);padding-right:20px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.lh::before,.fhead.dr::before{content:"";flex:0 0 auto;width:8px;height:12px;margin-right:1px;background:radial-gradient(circle,var(--muted) 1px,transparent 1.4px) 0 0/4px 4px;opacity:.55}
.fhead.dr{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.fhead .pmin{margin-left:auto}
.panel.min .psc>*:not(.fhead){display:none!important}
.panel.min .psc{padding:8px 12px}
.conbar .grip{width:14px;align-self:stretch;cursor:grab;touch-action:none;background:radial-gradient(circle,var(--muted) 1px,transparent 1.4px) 0 0/4px 4px;opacity:.55;margin:4px 0 4px 6px}
.lh b{color:var(--plum-ink);font-weight:600}
.lx{position:absolute;right:-3px;top:-2px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.lx:hover{background:rgba(59,29,82,.09)}.lx svg{width:13px;height:13px}
.lenpop label,.minipop label{display:flex;flex-direction:column;gap:1px;font:600 9px var(--font-data);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}
.lenpop input,.minipop input.big{font:600 16px var(--font-data);text-align:right;padding:2px 6px;border-radius:7px;border:1px solid var(--plum-line);background:#fff;width:100%;color:var(--plum-ink)}
.minipop input:not(.big){padding:4px 7px;font-size:14px}
.lrow{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.lin{display:flex;gap:5px;align-items:flex-end}
.lin label{flex:1}
.lbtns{display:flex;gap:5px;justify-content:flex-end}
.ib{width:31px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;color:var(--plum);background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px var(--plum-line)}
.ib svg{width:17px;height:17px}
.ib:hover{background:#fff}
.ib.ok{background:linear-gradient(180deg,#34a361,#23794a);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 2px 6px rgba(35,121,74,.35)}
.ib.ok:hover{background:linear-gradient(180deg,#3cb26c,#268453)}
.ib.ok svg{stroke-width:2.6}
.ib.no{color:var(--crit)}
.mpb{font:13px/1.35 var(--font-data);color:var(--ink)}
.mpb b{font-weight:600;color:var(--plum-ink)}
.mchips{display:flex;flex-wrap:wrap;gap:4px}
.mchip{padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px var(--plum-line);font:600 12px var(--font-data);color:var(--plum-ink);white-space:nowrap}
.mchip:hover{background:#fff}.mchip.on{background:var(--plum);color:#f5e6b8;box-shadow:none}
.mchip small{font-weight:400;color:var(--muted);margin-left:4px}.mchip.on small{color:#e3d3f0}
.conbar{position:absolute;z-index:16;border-radius:999px;padding:4px;display:flex;gap:2px;align-items:center}
.conbar .cb{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px;padding:4px 6px 3px;border-radius:999px;color:var(--plum)}
.conbar .cb svg{width:19px;height:19px}
.conbar .cb span{font:600 8.5px var(--font-data);letter-spacing:.06em;text-transform:uppercase;color:var(--plum-ink)}
.conbar .cb:hover:not(:disabled){background:rgba(59,29,82,.09)}
.conbar .cb:disabled{opacity:.3;cursor:default}
.conbar .ct{font:600 11px var(--font-data);color:var(--muted);padding:0 6px 0 10px;white-space:nowrap}
.rotw{position:absolute;top:12px;left:calc(var(--rl, 68px) + 24px);z-index:11;border-radius:16px;padding:6px 10px 4px;display:grid;grid-template-columns:34px 54px 34px;align-items:center;justify-items:center;gap:0 6px;user-select:none;-webkit-user-select:none}
.rotw .rb{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--plum)}
.rotw .rb:hover,.rotw .lab:hover{background:rgba(255,255,255,.7)}
.rotw .rb svg{width:20px;height:20px}
.rotw .cmp{width:52px;height:52px;cursor:grab;touch-action:none;display:block}
.rotw .cmp:active{cursor:grabbing}
.rotw .lab{font:600 12px var(--font-data);color:var(--plum-ink);padding:2px 6px;border-radius:6px;min-width:34px;text-align:center}
.legend{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:17;border-radius:999px;padding:6px 6px 6px 16px;display:flex;gap:8px;align-items:center;font:600 13px var(--font-data);color:var(--plum-ink);white-space:nowrap;max-width:calc(100% - 24px)}
.legend .pulse{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(180,138,46,.6);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(180,138,46,.6)}70%{box-shadow:0 0 0 9px rgba(180,138,46,0)}100%{box-shadow:0 0 0 0 rgba(180,138,46,0)}}
.cchip{display:inline-flex;align-items:stretch;border-radius:8px;overflow:hidden}
.cchip .code{border-radius:0}
.cchip .cx{padding:0 7px;background:rgba(255,255,255,.45);color:var(--muted);font-size:13px}
.cchip .cx:hover{background:var(--crit-soft);color:var(--crit)}
.ptbl tr[data-pt]{cursor:pointer}
.ptbl tr[data-pt]:hover td{background:var(--plum-soft)}
.ptbl td,.ptbl th{white-space:nowrap}
.stepper{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.stepper .field{width:120px}
.buildbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:15;border-radius:999px;padding:5px 6px 5px 14px;display:flex;gap:6px;align-items:center;font:12.5px var(--font-data);color:var(--plum-ink);white-space:nowrap;max-width:calc(100% - 24px);overflow-x:auto}

.docview{overflow:auto;background:transparent}
.doc{max-width:calc(1040px + var(--rl) + var(--rr) + 60px);margin:0 auto;padding:22px calc(var(--rr) + 30px) 60px calc(var(--rl) + 30px);display:flex;flex-direction:column;gap:18px}
.doc h2{margin:0;font:400 23px/1.2 var(--font-mark);letter-spacing:.03em;color:var(--plum-ink);text-wrap:balance}
.doc h3{margin:0 0 8px;font:600 11px var(--font-data);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.muted{color:var(--muted)}
