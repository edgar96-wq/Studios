plugins { id 'com.android.application' }

android {
    namespace 'com.crewstudio.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.crewstudio.app'
        minSdk 29
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '0.6.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        crew {
            storeFile file(project.property('crewStoreFile'))
            storePassword project.property('crewStorePassword')
            keyAlias project.property('crewKeyAlias')
            keyPassword project.property('crewKeyPassword')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.crew
        }
        debug { signingConfig signingConfigs.crew }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'html' }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
