plugins { id 'com.android.application' }

android {
    namespace 'com.crewstudio.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.crewstudio.app'
        minSdk 29
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '0.8.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        crew {
            storeFile file(project.property('crewStoreFile'))
            storePassword project.property('crewStorePassword')
            keyAlias project.property('crewKeyAlias')
            keyPassword project.property('crewKeyPassword')
        }
    }

    buildTypes {
        release {
            // off, as in Microsoft's own MSAL samples: shrinking can break MSAL's token cache (Gson). The app is a few MB larger.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.crew
        }
        debug { signingConfig signingConfigs.crew }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'html' }
    packaging {
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'] }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.microsoft.identity.client:msal:8.6.0'
}
